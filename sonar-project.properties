# Required metadata
sonar.projectKey=chit-chat-key
sonar.projectName=Chit Chat
sonar.projectVersion=1.0
# Path to source directories (comma-separated)
sonar.sources=src
# Language
sonar.language=ts
# Encoding of the source files
sonar.sourceEncoding=UTF-8
# Exclusions for code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx
# Path to the lcov report
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Additional settings
sonar.typescript.tsconfigPath=tsconfig.json